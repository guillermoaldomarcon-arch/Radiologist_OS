name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test_templates.py
        run: python3 tests/test_templates.py

      - name: Run test_quality_adversarial.py
        run: python3 tests/test_quality_adversarial.py

      - name: Run test_followup.py
        run: python3 tests/test_followup.py
